apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }} 
  namespace: {{ .Values.metadata.namespace }}
  labels:
    app: {{ .Chart.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env: 
          - name: DB_CONNECTION
            valueFrom: 
              secretKeyRef:
               name: bubblepays
               key: dbconnection
          ports:
            - containerPort: {{ .Values.service.port }}

  
    
           